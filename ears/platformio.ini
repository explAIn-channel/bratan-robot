; «Уши Братана»: 4× INMP441 на одной ESP32 NodeMCU-32S, два I2S на общем такте.
; Прошивать через tools/flash.py: первый раз «usb», дальше «ota» по Wi-Fi (пароль OTA — в .ota-pass, не в коде).
[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4): старый драйвер I2S с ведомым режимом
board = nodemcu-32s                   ; разметка default.csv: два места под прошивку — OTA пишет в свободное
framework = arduino
monitor_speed = 921600
lib_deps = tzapu/WiFiManager@2.0.17
    h2zero/NimBLE-Arduino@1.4.2
build_flags = -O2 '-DOTA_PASS="${sysenv.USHI_OTA_PASS}"' '-DBLE_TOKEN="${sysenv.USHI_BLE_TOKEN}"'

[env:usb]
upload_speed = 921600

[env:ota]
upload_protocol = espota
upload_port = bratan-ushi.local
upload_flags = --auth=${sysenv.USHI_OTA_AUTH}      ; пароль платы сейчас; вшивается USHI_OTA_PASS (при смене — новый)
